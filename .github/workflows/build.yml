name: Build & Package iOS Studio IPA (TrollStore Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build iOS Studio IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -list -project iOSStudio/iOSStudio.xcodeproj

      - name: Build Application for Device (Ad-Hoc Signed)
        run: |
          xcodebuild build \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload and Create TrollStore-Compatible IPA
        run: |
          mkdir -p build/ipa_build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "iOSStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: iOSStudio.app was not found in build products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_build/Payload/

          # Ensure ad-hoc signature for TrollStore binary acceptance
          codesign --force --deep --sign - "build/ipa_build/Payload/iOSStudio.app"

          cd build/ipa_build
          zip -r -9 ../../iOSStudio.ipa Payload
          cd ../..

      - name: Verify IPA Structure
        run: |
          echo "=== Verifying IPA structure ==="
          ls -lh iOSStudio.ipa
          unzip -l iOSStudio.ipa | head -n 30

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "iOS Studio v1.0.0 (Build ${{ github.run_number }})"
          body: "Official TrollStore-ready IPA build of iOS Studio. No Apple Developer subscription required."
          files: iOSStudio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
