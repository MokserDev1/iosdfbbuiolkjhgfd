name: Build & Package iOS Studio IPA (TrollStore Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS Studio IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -list -project iOSStudio/iOSStudio.xcodeproj

      - name: Build Application for Device (Unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log

      - name: Commit Failure Log for Inspection
        if: failure()
        run: |
          mkdir -p ci_logs
          tail -n 150 xcodebuild.log > ci_logs/last_error.log
          git config user.name "CI Bot"
          git config user.email "bot@ci.local"
          git add ci_logs/last_error.log
          git commit -m "chore: save xcodebuild failure log" || true
          git push origin main || true

      - name: Package Payload and Create TrollStore-Compatible IPA
        run: |
          mkdir -p build/ipa_build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "iOSStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "iOSStudio.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: iOSStudio.app was not found in build products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_build/Payload/

          if command -v codesign &> /dev/null; then
            codesign --force --deep --sign - "build/ipa_build/Payload/iOSStudio.app" || true
          fi

          cd build/ipa_build
          zip -r -9 ../../iOSStudio.ipa Payload
          cd ../..

      - name: Commit IPA
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@ci.local"
          mkdir -p release_bin
          cp iOSStudio.ipa release_bin/
          git add release_bin/iOSStudio.ipa
          git commit -m "build: attach iOSStudio.ipa binary" || true
          git push origin main || true
