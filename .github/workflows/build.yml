name: Build & Package iOS Studio IPA (TrollStore Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS Studio IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          echo "=== System Info ==="
          sw_vers
          xcodebuild -version

      - name: Create Dummy Development Certificate
        run: |
          echo "Setting up ad-hoc signing for TrollStore build..."

      - name: Build Application for Device (Unsigned)
        run: |
          xcodebuild clean build \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || (echo "=== XCODEBUILD LOG TAIL ===" && tail -n 100 xcodebuild.log && exit 1)

      - name: Package Payload and Create TrollStore-Compatible IPA
        run: |
          mkdir -p build/ipa_build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "iOSStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: iOSStudio.app was not found in build products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_build/Payload/

          if command -v codesign &> /dev/null; then
            codesign --force --deep --sign - "build/ipa_build/Payload/iOSStudio.app" || true
          fi

          cd build/ipa_build
          zip -r -9 ../../iOSStudio.ipa Payload
          cd ../..

      - name: Verify IPA Structure
        run: |
          echo "=== Verifying IPA structure ==="
          ls -lh iOSStudio.ipa
          unzip -l iOSStudio.ipa | head -n 30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSStudio-TrollStore-IPA
          path: iOSStudio.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs If Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log
          if-no-files-found: ignore
