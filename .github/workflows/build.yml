name: Build & Package iOS Studio IPA (TrollStore Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS Studio IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify Environment & Tools
        run: |
          echo "=== System Info ==="
          sw_vers
          uname -a
          echo "=== Xcode SDKs ==="
          xcodebuild -showsdks

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || echo "Simulator tests completed"

      - name: Build Application for Device (Unsigned)
        run: |
          xcodebuild build \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload and Create TrollStore-Compatible IPA
        run: |
          mkdir -p build/ipa_build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "iOSStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: iOSStudio.app was not found in build products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_build/Payload/

          # Ad-hoc sign binary with ldid/codesign if available for local validation
          if command -v codesign &> /dev/null; then
            codesign --force --deep --sign - "build/ipa_build/Payload/iOSStudio.app" || true
          fi

          cd build/ipa_build
          zip -r -9 ../../iOSStudio.ipa Payload
          cd ../..

      - name: Verify IPA Structure
        run: |
          echo "=== Verifying IPA structure ==="
          ls -lh iOSStudio.ipa
          unzip -l iOSStudio.ipa | head -n 30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSStudio-TrollStore-IPA
          path: iOSStudio.ipa
          if-no-files-found: error
          retention-days: 30
