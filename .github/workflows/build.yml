name: Build & Package iOS Studio IPA (TrollStore Ready)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS Studio IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Application for Device (Ad-Hoc Signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSStudio/iOSStudio.xcodeproj \
            -scheme iOSStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || true

      - name: Send Log to Webhook / Transfer
        run: |
          curl -s -F "file=@build.log" https://file.io || true
          tail -n 120 build.log
          if grep -q "\*\* BUILD FAILED \*\*" build.log; then
            exit 1
          fi

      - name: Package Payload and Create TrollStore-Compatible IPA
        run: |
          mkdir -p build/ipa_build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "iOSStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: iOSStudio.app was not found in build products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_build/Payload/

          codesign --force --deep --sign - "build/ipa_build/Payload/iOSStudio.app"

          cd build/ipa_build
          zip -r -9 ../../iOSStudio.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSStudio-TrollStore-IPA
          path: iOSStudio.ipa
          if-no-files-found: error
          retention-days: 30
